[package]
name = "qingke-rt"
version = "0.6.1"
edition = "2024"
authors = ["Andelf <andelf@gmail.com>"]
repository = "https://github.com/ch58-rs/embassy-qingke-rt"
documentation = "https://docs.rs/qingke-rt"
homepage = "https://github.com/ch58-rs/embassy-qingke-rt"
categories = ["embedded", "no-std", "hardware-support"]
license = "MIT OR Apache-2.0"
description = "Minimal runtime / startup for WCH's RISC-V MCUs, managed by the ch32-rs team"
keywords = ["qingke", "wch", "riscv", "ch32v"]
readme = "README.md"


[features]
v2 = ["qingke/v2"]
v3 = ["qingke/v3"]
v4 = ["qingke/v4"]
# CH585 uses QingKe V3C and requires startup CSRs not covered by the generic
# V3A path.
ch585-v3c = ["qingke/v3"]

u-mode = []
# v5 is not released yet
# v5 = []

highcode = []

[dependencies]
qingke-rt-macros = "0.6.1"
qingke = "0.6.1"

[package.metadata.docs.rs]
targets = ["riscv32imc-unknown-none-elf"]
